<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Tour Du Lịch - Vietjet Travel</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tours.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="images/download2.png" alt="Vietjet Logo" onerror="this.src='images/download.jpg'">
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Trang Chủ</a>
        <a href="flights.html" class="nav-link"><i class="fa-solid fa-plane-departure"></i> Chuyến Bay</a>
        <a href="tours.html" class="nav-link active"><i class="fa-solid fa-umbrella-beach"></i> Tour Du Lịch</a>
      </nav>

      <div class="header-actions">
        <a href="tel:19001886" class="hotline-btn">
          <i class="fa-solid fa-phone-volume"></i> 1900 1886
        </a>
        <a href="cart.html" class="cart-btn" title="Xem giỏ hàng">
          <i class="fa-solid fa-suitcase-rolling"></i>
          <span>Giỏ Hàng</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <button class="mobile-menu-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="tours-page-section">
    <div class="container" style="max-width: 1040px;">
      
      <!-- Back Link -->
      <div style="margin-bottom: 20px;">
        <a href="tours.html" class="btn btn-outline btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách tour
        </a>
      </div>

      <!-- Container Chi Tiết Tour -->
      <div id="tourDetailContainer">
        <!-- Render động bằng JavaScript -->
        <div style="text-align: center; padding: 40px; color: var(--color-text-muted);">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
          <p style="margin-top: 10px;">Đang tải thông tin tour từ SQLite...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 Vietjet Travel. Nền tảng SQLite WebAssembly.</p>
        <p>Hỗ trợ đặt tour: <strong>nvhai061993@gmail.com</strong></p>
      </div>
    </div>
  </footer>

  <!-- SQLite WebAssembly Engine & Controllers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tour-detail.js"></script>

</body>
</html>
